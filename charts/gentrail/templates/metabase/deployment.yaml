{{- if .Values.metabase.enabled }}
# Metabase (the internal analytics portal). Our-cloud-only: gated off so a BYOC
# install never renders it (same pattern as docsServer/cloudflared). infra/k3s-apps
# flips metabase.enabled, supplies the app-DB connection secret, routes
# metabase.gentrail.ai to this Service on the k3s tunnel, and gates it behind
# Cloudflare Access (SSO/email allowlist) — Metabase has no shared-cookie bridge
# to the dashboard, so the tunnel front door is the access boundary.
#
# Two databases, kept strictly separate:
#   1. APPLICATION DB (configured here): a dedicated `metabase` database on the
#      existing dashboard RDS instance, passed as MB_DB_CONNECTION_URI from a
#      secret. This is Metabase's own state (questions, dashboards, users). We do
#      NOT use the default embedded H2 file DB — H2 lives on the pod's filesystem
#      and is lost on every reschedule, and it does not survive >1 replica.
#   2. METRICS DATASOURCE (NOT app config): the separate `metrics` database is
#      added in the Metabase UI as a data source, using a role granted SELECT
#      only on the PII-free `v_events` view (never the `persons` table). That is
#      operator-driven setup, not Helm config — see this directory's README.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: metabase
  namespace: {{ .Release.Namespace }}
  labels:
{{ include "gentrail.labels" (merge (dict "component" "metabase") .) | indent 4 }}
spec:
  # Single replica: Metabase serializes schema migrations on its app DB at boot,
  # so scale stays at 1 (raise deliberately only after reading the MB HA notes).
  replicas: {{ .Values.metabase.replicaCount }}
  selector:
    matchLabels:
{{ include "gentrail.selectorLabels" (merge (dict "component" "metabase") .) | indent 6 }}
  template:
    metadata:
      labels:
{{ include "gentrail.selectorLabels" (merge (dict "component" "metabase") .) | indent 8 }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 2000
        fsGroup: 2000
        seccompProfile: { type: RuntimeDefault }
{{ include "gentrail.imagePullSecrets" . | indent 6 }}
      containers:
        - name: metabase
          # External public image (not the gentrail registry), so it is templated
          # straight from values rather than via the gentrail.image helper — same
          # approach as nats/cloudflared.
          image: "{{ .Values.metabase.image.repository }}:{{ .Values.metabase.image.tag }}"
          imagePullPolicy: {{ .Values.metabase.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: MB_JETTY_PORT
              value: "3000"
            # Application database: Postgres on the shared RDS, NOT the default H2.
            - name: MB_DB_TYPE
              value: postgres
            # Full DSN (postgres://user:pass@host:5432/metabase?sslmode=require)
            # for Metabase's own application database. Sourced from a k8s secret so
            # the RDS password never lands in the chart values or TF state.
            - name: MB_DB_CONNECTION_URI
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.metabase.appDbSecretName }}
                  key: connection-uri
            # Non-root needs a writable plugins dir; point it at the emptyDir below
            # so the default /plugins (image-owned by root) is never written.
            - name: MB_PLUGINS_DIR
              value: /plugins
          resources: {{- toYaml .Values.metabase.resources | nindent 12 }}
          # Metabase exposes GET /api/health; it returns 200 only once the app-DB
          # migrations finish and the web server is serving. JVM boot + migrations
          # are slow, so the liveness probe gets a generous initial delay and
          # failureThreshold to avoid CrashLoop during a cold start.
          readinessProbe:
            httpGet: { path: /api/health, port: http }
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet: { path: /api/health, port: http }
            initialDelaySeconds: 120
            periodSeconds: 30
            failureThreshold: 6
          volumeMounts:
            - name: plugins
              mountPath: /plugins
            - name: tmp
              mountPath: /tmp
      volumes:
        # Driver-extraction scratch + JVM temp. Ephemeral by design: all durable
        # state lives in the Postgres app DB, so nothing here needs to persist.
        - name: plugins
          emptyDir: {}
        - name: tmp
          emptyDir: {}
{{- end }}

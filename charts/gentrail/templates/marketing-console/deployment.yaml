{{- if .Values.marketingConsole.enabled }}
# marketing-console: the campaign-link UI, our-cloud-only (gated off for BYOC).
# It calls the events-gateway admin routes (gatewayUrl) authenticated with an
# admin secret it fetches from SSM at boot via IRSA, and gates every route on the
# shared dashboard session cookie (AIGENTRAIL_SESSION_SECRET).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: marketing-console
  namespace: {{ .Release.Namespace }}
  labels:
{{ include "gentrail.labels" (merge (dict "component" "marketing-console") .) | indent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
{{ include "gentrail.selectorLabels" (merge (dict "component" "marketing-console") .) | indent 6 }}
  template:
    metadata:
      labels:
{{ include "gentrail.selectorLabels" (merge (dict "component" "marketing-console") .) | indent 8 }}
    spec:
      serviceAccountName: marketing-console
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        fsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
{{ include "gentrail.imagePullSecrets" . | indent 6 }}
      containers:
        - name: marketing-console
          image: {{ include "gentrail.image" (merge (dict "component" "marketing-console") .) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.marketingConsole.port }}
          env:
            - name: MARKETING_CONSOLE_ADDR
              value: {{ printf ":%v" .Values.marketingConsole.port | quote }}
            - name: LINKS_GATEWAY_URL
              value: {{ .Values.marketingConsole.gatewayUrl | quote }}
            - name: LINKS_ADMIN_SECRET_PARAM
              value: {{ .Values.marketingConsole.adminSecretParam | quote }}
            - name: LINKS_PUBLIC_BASE
              value: {{ .Values.marketingConsole.publicBase | quote }}
            {{- if .Values.marketingConsole.shortBase }}
            - name: LINKS_SHORT_BASE
              value: {{ .Values.marketingConsole.shortBase | quote }}
            {{- end }}
            - name: AWS_REGION
              value: {{ .Values.aws.region | quote }}
            - name: DASHBOARD_INTERNAL_URL
              value: {{ .Values.marketingConsole.dashboardInternalUrl | quote }}
            {{- $cookieDomain := .Values.marketingConsole.cookieDomain | default .Values.dashboard.cookieDomain }}
            {{- if $cookieDomain }}
            - name: AIGENTRAIL_COOKIE_DOMAIN
              value: {{ $cookieDomain | quote }}
            {{- end }}
            {{- if .Values.dashboard.sessionSecretName }}
            - name: AIGENTRAIL_SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.dashboard.sessionSecretName }}
                  key: session-secret
            {{- end }}
            {{- if and .Values.irsa.marketingConsole (eq .Values.mode "k3s") }}
{{- include "gentrail.irsaEnv" .Values.irsa.marketingConsole | nindent 12 }}
            {{- end }}
          resources: {{- toYaml .Values.marketingConsole.resources | nindent 12 }}
          readinessProbe:
            tcpSocket: { port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: http }
            initialDelaySeconds: 30
            periodSeconds: 30
          {{- if and .Values.irsa.marketingConsole (eq .Values.mode "k3s") }}
          volumeMounts:
{{- include "gentrail.irsaTokenMount" . | nindent 12 }}
          {{- end }}
      {{- if and .Values.irsa.marketingConsole (eq .Values.mode "k3s") }}
      volumes:
{{- include "gentrail.irsaTokenVolume" . | nindent 8 }}
      {{- end }}
{{- end }}

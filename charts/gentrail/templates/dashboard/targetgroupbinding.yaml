{{- if .Values.ingress.targetGroups.dashboardArn }}
apiVersion: elbv2.k8s.aws/v1beta1
kind: TargetGroupBinding
metadata:
  name: dashboard
  namespace: {{ .Release.Namespace }}
spec:
  serviceRef:
    name: dashboard
    port: 8001
  targetGroupARN: {{ .Values.ingress.targetGroups.dashboardArn | quote }}
  targetType: ip
{{- end }}

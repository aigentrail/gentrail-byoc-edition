{{- if .Values.agentChat.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agent-chat
  namespace: {{ .Release.Namespace }}
  labels:
{{ include "gentrail.labels" (merge (dict "component" "agent-chat") .) | indent 4 }}
  annotations:
    eks.amazonaws.com/role-arn: {{ .Values.irsa.agentChat | quote }}
{{- end }}

{{- if .Values.agentChat.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: agent-chat
  namespace: {{ .Release.Namespace }}
  labels:
{{ include "gentrail.labels" (merge (dict "component" "agent-chat") .) | indent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.agentChat.port }}
      targetPort: http
      name: http
  selector:
{{ include "gentrail.selectorLabels" (merge (dict "component" "agent-chat") .) | indent 4 }}
{{- end }}
